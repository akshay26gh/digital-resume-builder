<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Digital Resume Builder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">Digital Resume Builder</a>
    {% if current_user.is_authenticated %}
    <div class="ms-auto d-flex align-items-center gap-3">
      <a class="nav-link text-light" href="{{ url_for('profile.dashboard') }}">Profile</a>
      <a class="nav-link text-light" href="{{ url_for('resumes.generate') }}">Generate</a>
      <a class="nav-link text-light" href="{{ url_for('resumes.history') }}">Versions</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="m-0">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-sm btn-outline-light">Logout</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
