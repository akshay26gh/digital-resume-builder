{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Create account</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Name</label>
        <input class="form-control" name="name" required autofocus></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required></div>
      <div class="mb-3"><label class="form-label">Password (min 8 characters)</label>
        <input class="form-control" type="password" name="password" minlength="8" required></div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div></div>
</div></div>
{% endblock %}
